<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>公众号发布设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#07c160;text-decoration:none}
a:hover{color:#06a852}
input,button,select{font-family:inherit}
</style>
</helmet>

<div style="min-height:1080px;padding-bottom:40px">

  <header style="background:#ffffff;border-bottom:1px solid #e8eaed">
    <div style="max-width:760px;margin:0 auto;padding:0 28px;height:58px;display:flex;align-items:center;gap:14px">
      <a href="#" aria-label="返回文章列表" style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid #e6e9ee;color:#4b5563;font-size:15px;line-height:1">←</a>
      <div style="font-size:15px;font-weight:600;color:#1f2329">发布设置</div>
      <div style="margin-left:auto;font-size:12px;color:#9aa1a9">publisher.flyooo.uk</div>
    </div>
  </header>

  <main style="max-width:760px;margin:0 auto;padding:26px 28px 0">

    <div style="margin-bottom:18px">
      <h1 style="margin:0;font-size:19px;font-weight:600;color:#1f2329;letter-spacing:.2px">自动化配置</h1>
      <p style="margin:6px 0 0;font-size:13px;color:#8a9099;line-height:1.6">Notion 状态改成「发布」之后，用哪个主题排版、要不要给你发通知，都在这里定。</p>
    </div>

    <!-- 发布主题 -->
    <section style="background:#ffffff;border:1px solid #eceef1;border-radius:14px;padding:20px 20px 22px;box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:14px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px">
        <h2 style="margin:0;font-size:14px;font-weight:600;color:#1f2329">发布主题</h2>
        <span style="font-size:12px;color:#9aa1a9">12 个可选</span>
      </div>
      <p style="margin:0 0 14px;font-size:12px;color:#8a9099">推送草稿时套用的公众号排版样式，改完下次发布才生效。</p>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px">
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #07c160;border-radius:11px;background:#f2fcf7;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#ff502c;flex:none"></span>
          <span style="font-size:13px;color:#1f2329">默认</span>
          <svg width="14" height="14" viewBox="0 0 16 16" style="margin-left:auto;flex:none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="#07c160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#1e80ff;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">掘金</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#4870ac;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">Lapis</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#e49123;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">Maize</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#191b1f;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">Medium</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#e9694a;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">Orange Heart</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#3db8bf;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">Phycat</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#f27f79;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">Pie</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#8064a9;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">Purple</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:linear-gradient(90deg,#ff5f6d,#ffc371,#47cf73,#4aa8ff,#a06bff);flex:none"></span>
          <span style="font-size:13px;color:#3d434b">Rainbow</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#0069c2;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">头条</span>
        </label>
        <label style="display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e6e9ee;border-radius:11px;cursor:pointer">
          <span style="width:18px;height:18px;border-radius:5px;background:#535861;flex:none"></span>
          <span style="font-size:13px;color:#3d434b">知乎</span>
        </label>
      </div>
    </section>

    <!-- 通知 -->
    <section style="background:#ffffff;border:1px solid #eceef1;border-radius:14px;padding:20px 20px 22px;box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <h2 style="margin:0;font-size:14px;font-weight:600;color:#1f2329">通知</h2>
        <label style="display:flex;align-items:center;gap:9px;cursor:pointer;padding:6px 0 6px 8px">
          <span style="font-size:12px;color:#8a9099" id="bark-state">已开启</span>
          <input type="checkbox" checked style="position:absolute;opacity:0;width:0;height:0">
          <span style="position:relative;display:inline-block;width:40px;height:23px;border-radius:12px;background:#07c160;flex:none">
            <span style="position:absolute;top:2px;left:19px;width:19px;height:19px;border-radius:50%;background:#ffffff;box-shadow:0 1px 2px rgba(0,0,0,.18)"></span>
          </span>
        </label>
      </div>
      <p style="margin:0 0 16px;font-size:12px;color:#8a9099">用 Bark 推送到你的 iPhone。发布过程不用一直盯着，成了败了手机都会响。</p>

      <div style="margin-bottom:13px">
        <label for="bark-key" style="display:block;font-size:12px;font-weight:500;color:#5b626b;margin-bottom:6px">设备 Key</label>
        <input id="bark-key" type="text" value="aBcDeFgH12345678" placeholder="在 Bark App 首页复制" style="width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:1px solid #e0e4e9;border-radius:9px;font-size:13px;color:#1f2329;background:#fbfcfd">
        <p style="margin:5px 0 0;font-size:11px;color:#a2a8b0">Bark App 首页那一串，不含 https://api.day.app/</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div>
          <label for="bark-server" style="display:block;font-size:12px;font-weight:500;color:#5b626b;margin-bottom:6px">服务器</label>
          <input id="bark-server" type="text" value="https://api.day.app" style="width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:1px solid #e0e4e9;border-radius:9px;font-size:13px;color:#1f2329;background:#fbfcfd">
        </div>
        <div>
          <label for="bark-group" style="display:block;font-size:12px;font-weight:500;color:#5b626b;margin-bottom:6px">分组</label>
          <input id="bark-group" type="text" value="公众号发布" style="width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:1px solid #e0e4e9;border-radius:9px;font-size:13px;color:#1f2329;background:#fbfcfd">
        </div>
      </div>

      <div style="margin-bottom:4px">
        <div style="font-size:12px;font-weight:500;color:#5b626b;margin-bottom:8px">什么时候通知我</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <label style="display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #07c160;border-radius:9px;background:#f2fcf7;cursor:pointer">
            <input type="checkbox" checked style="width:14px;height:14px;accent-color:#07c160;margin:0">
            <span style="font-size:12px;color:#1f2329">收到发布请求</span>
          </label>
          <label style="display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #07c160;border-radius:9px;background:#f2fcf7;cursor:pointer">
            <input type="checkbox" checked style="width:14px;height:14px;accent-color:#07c160;margin:0">
            <span style="font-size:12px;color:#1f2329">发布成功</span>
          </label>
          <label style="display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #07c160;border-radius:9px;background:#f2fcf7;cursor:pointer">
            <input type="checkbox" checked style="width:14px;height:14px;accent-color:#07c160;margin:0">
            <span style="font-size:12px;color:#1f2329">发布失败</span>
          </label>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #f0f2f4">
        <button type="button" style="height:34px;padding:0 14px;border:1px solid #dfe3e8;border-radius:9px;background:#ffffff;font-size:12px;color:#4b5563;cursor:pointer">发送测试通知</button>
        <span style="font-size:11px;color:#a2a8b0">会立刻推一条到手机，确认 Key 没填错</span>
      </div>
    </section>

    <!-- 保存 -->
    <div style="display:flex;align-items:center;gap:14px;background:#ffffff;border:1px solid #eceef1;border-radius:14px;padding:14px 20px;box-shadow:0 1px 2px rgba(16,24,40,.04)">
      <button type="button" style="height:38px;padding:0 22px;border:none;border-radius:10px;background:#07c160;color:#ffffff;font-size:13px;font-weight:500;cursor:pointer">保存配置</button>
      <span style="font-size:12px;color:#8a9099">保存后立即生效</span>
      <span style="margin-left:auto;font-size:11px;color:#a2a8b0">配置写在服务器 data/config.json</span>
    </div>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
