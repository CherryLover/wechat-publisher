<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>公众号发布设置 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#07c160;text-decoration:none}
input,button{font-family:inherit}
</style>
</helmet>

<div style="min-height:844px;padding-bottom:28px">

  <header style="background:#ffffff;border-bottom:1px solid #e8eaed;padding:0 16px;height:50px;display:flex;align-items:center;gap:10px">
    <a href="#" aria-label="返回" style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid #e6e9ee;color:#4b5563;font-size:14px;line-height:1">←</a>
    <div style="font-size:15px;font-weight:600;color:#1f2329">发布设置</div>
  </header>

  <main style="padding:18px 16px 0">

    <h1 style="margin:0 0 4px;font-size:17px;font-weight:600;color:#1f2329">自动化配置</h1>
    <p style="margin:0 0 16px;font-size:12px;color:#8a9099;line-height:1.6">状态改成「发布」之后，用哪个主题排版、要不要通知你，都在这里定。</p>

    <section style="background:#ffffff;border:1px solid #eceef1;border-radius:12px;padding:15px 14px 16px;margin-bottom:12px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px">
        <h2 style="margin:0;font-size:13px;font-weight:600;color:#1f2329">发布主题</h2>
        <span style="font-size:11px;color:#9aa1a9">12 个</span>
      </div>
      <p style="margin:0 0 12px;font-size:11px;color:#8a9099;line-height:1.5">推送草稿时套用的排版样式</p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #07c160;border-radius:10px;background:#f2fcf7">
          <span style="width:16px;height:16px;border-radius:5px;background:#ff502c;flex:none"></span>
          <span style="font-size:12px;color:#1f2329">默认</span>
          <svg width="12" height="12" viewBox="0 0 16 16" style="margin-left:auto;flex:none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="#07c160" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#1e80ff;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">掘金</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#4870ac;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">Lapis</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#e49123;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">Maize</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#191b1f;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">Medium</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#e9694a;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">橙心</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#3db8bf;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">Phycat</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#f27f79;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">Pie</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#8064a9;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">Purple</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:linear-gradient(90deg,#ff5f6d,#ffc371,#47cf73,#4aa8ff,#a06bff);flex:none"></span>
          <span style="font-size:12px;color:#3d434b">Rainbow</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#0069c2;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">头条</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e6e9ee;border-radius:10px">
          <span style="width:16px;height:16px;border-radius:5px;background:#535861;flex:none"></span>
          <span style="font-size:12px;color:#3d434b">知乎</span>
        </label>
      </div>
    </section>

    <section style="background:#ffffff;border:1px solid #eceef1;border-radius:12px;padding:15px 14px 16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
        <h2 style="margin:0;font-size:13px;font-weight:600;color:#1f2329">通知</h2>
        <label style="display:flex;align-items:center;gap:8px;padding:4px 0">
          <span style="font-size:11px;color:#8a9099">已开启</span>
          <input type="checkbox" checked style="position:absolute;opacity:0;width:0;height:0">
          <span style="position:relative;display:inline-block;width:38px;height:22px;border-radius:11px;background:#07c160;flex:none">
            <span style="position:absolute;top:2px;left:18px;width:18px;height:18px;border-radius:50%;background:#ffffff"></span>
          </span>
        </label>
      </div>
      <p style="margin:0 0 14px;font-size:11px;color:#8a9099;line-height:1.5">Bark 推送到 iPhone，成了败了都会响</p>

      <label for="k2" style="display:block;font-size:11px;font-weight:500;color:#5b626b;margin-bottom:6px">设备 Key</label>
      <input id="k2" type="text" value="aBcDeFgH12345678" style="width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:1px solid #e0e4e9;border-radius:9px;font-size:13px;color:#1f2329;background:#fbfcfd;margin-bottom:12px">

      <label for="s2" style="display:block;font-size:11px;font-weight:500;color:#5b626b;margin-bottom:6px">服务器</label>
      <input id="s2" type="text" value="https://api.day.app" style="width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:1px solid #e0e4e9;border-radius:9px;font-size:13px;color:#1f2329;background:#fbfcfd;margin-bottom:12px">

      <label for="g2" style="display:block;font-size:11px;font-weight:500;color:#5b626b;margin-bottom:6px">分组</label>
      <input id="g2" type="text" value="公众号发布" style="width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:1px solid #e0e4e9;border-radius:9px;font-size:13px;color:#1f2329;background:#fbfcfd">

      <div style="font-size:11px;font-weight:500;color:#5b626b;margin:14px 0 8px">什么时候通知我</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <label style="display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #07c160;border-radius:8px;background:#f2fcf7">
          <input type="checkbox" checked style="width:13px;height:13px;accent-color:#07c160;margin:0">
          <span style="font-size:11px;color:#1f2329">开始处理</span>
        </label>
        <label style="display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #07c160;border-radius:8px;background:#f2fcf7">
          <input type="checkbox" checked style="width:13px;height:13px;accent-color:#07c160;margin:0">
          <span style="font-size:11px;color:#1f2329">发布成功</span>
        </label>
        <label style="display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #07c160;border-radius:8px;background:#f2fcf7">
          <input type="checkbox" checked style="width:13px;height:13px;accent-color:#07c160;margin:0">
          <span style="font-size:11px;color:#1f2329">发布失败</span>
        </label>
      </div>

      <button type="button" style="width:100%;height:36px;margin-top:14px;border:1px solid #dfe3e8;border-radius:9px;background:#ffffff;font-size:12px;color:#4b5563">发送测试通知</button>
    </section>

    <button type="button" style="width:100%;height:44px;border:none;border-radius:11px;background:#07c160;color:#ffffff;font-size:14px;font-weight:500">保存配置</button>
    <p style="margin:10px 0 0;text-align:center;font-size:10px;color:#a2a8b0">写在服务器 data/config.json</p>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
