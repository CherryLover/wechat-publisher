<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 发布台</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;color:#09090b}
a{color:#07c160;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.card-wrap{width:410px;max-width:100%}
.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:22px}
.mark{width:44px;height:44px;border-radius:11px;background:#07c160;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.brand-name{font-size:15px;font-weight:600}
.brand-sub{font-size:13px;color:#71717a;margin-top:4px;text-align:center}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:26px 24px 22px}
h1{margin:0 0 6px;font-size:17px;font-weight:600}
.desc{margin:0 0 18px;font-size:13px;color:#71717a;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;border:none;border-radius:7px;background:#07c160;color:#fff;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer}
.btn:hover{background:#06a852;text-decoration:none}
.field{margin-bottom:10px}
.lbl{display:block;font-size:12px;font-weight:500;color:#52525b;margin-bottom:5px}
.pw-wrap{position:relative}
.input{width:100%;height:40px;padding:0 12px;border:1px solid #e4e4e7;border-radius:7px;font-size:14px;color:#09090b;background:#fff;font-family:inherit}
.pw-wrap .input{padding-right:40px}
.input:focus{outline:none;border-color:#07c160}
.pw-eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:30px;height:30px;border:none;border-radius:6px;background:transparent;color:#71717a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pw-eye:hover{background:#f4f4f5;color:#09090b}
.err{margin:0 0 12px;padding:9px 12px;border-radius:7px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:12px;line-height:1.5}
.info{margin:0 0 14px;padding:9px 12px;border-radius:7px;background:#f0fdf5;border:1px solid #d5f2e3;color:#0b7a44;font-size:12px;line-height:1.5}
.row-link{margin-top:14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#71717a}
</style>
</head>
<body>
<div class="wrap">
  <div class="card-wrap">
    <div class="brand">
      <span class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </span>
      <div class="brand-name">公众号发布台 · 创建账号</div>
      <div class="brand-sub">注册后即可配置公众号并生成专属 MCP / Webhook 链接</div>
    </div>

    <div class="card">
      <h1>注册</h1>
      {% if not allow_registration %}
      <div class="err">当前已暂停新用户注册，请联系管理员开通。</div>
      <div class="row-link"><a href="/login">← 返回登录</a></div>
      {% else %}
      <p class="desc">平台免费使用；注册后请按引导填写公众号信息。</p>

      {% if error %}
      <div class="err">{{ error }}</div>
      {% endif %}

      <div class="info">AI 自动配图目前由平台统一免费赠送，后续为覆盖算力成本可能单独收费。</div>

      <form method="post" action="/register">
        <div class="field">
          <label class="lbl" for="reg-user">用户名</label>
          <input class="input" id="reg-user" type="text" name="username" value="{{ username_prefill }}" placeholder="3~64 位字母、数字、._-@" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="lbl" for="reg-name">显示昵称（可选）</label>
          <input class="input" id="reg-name" type="text" name="display_name" placeholder="例如：张三的公众号">
        </div>
        <div class="field">
          <label class="lbl" for="reg-pw">密码（至少 6 位）</label>
          <div class="pw-wrap">
            <input class="input" id="reg-pw" type="password" name="password" placeholder="设置登录密码" autocomplete="new-password" required>
            <button type="button" class="pw-eye" data-target="reg-pw" aria-label="显示密码">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field" style="margin-bottom:16px">
          <label class="lbl" for="reg-pw2">确认密码</label>
          <div class="pw-wrap">
            <input class="input" id="reg-pw2" type="password" name="confirm_password" placeholder="再次输入密码" autocomplete="new-password" required>
            <button type="button" class="pw-eye" data-target="reg-pw2" aria-label="显示密码">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn">注册并开始配置</button>
      </form>

      <div class="row-link">
        <span>已有账号？</span>
        <a href="/login">返回登录 →</a>
      </div>
      {% endif %}
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.pw-eye').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var input = document.getElementById(btn.dataset.target);
    if (!input) return;
    input.type = input.type === 'text' ? 'password' : 'text';
    input.focus();
  });
});
</script>
</body>
</html>
