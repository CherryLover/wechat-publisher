<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 发布台</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<script src="/static/lucide.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;color:#09090b;font-size:15px;line-height:1.6}
a{color:#07c160;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.card-wrap{width:440px;max-width:100%}
.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
.mark{width:50px;height:50px;border-radius:13px;background:#07c160;display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:#fff}
.brand-name{font-size:18px;font-weight:700}
.brand-sub{font-size:14px;color:#71717a;margin-top:4px;text-align:center}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.05);padding:28px 26px 24px}
h1{margin:0 0 6px;font-size:21px;font-weight:700}
.desc{margin:0 0 18px;font-size:14px;color:#71717a;line-height:1.55}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border:none;border-radius:8px;background:#07c160;color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.btn:hover{background:#06a852;text-decoration:none}
.field{margin-bottom:13px}
.lbl{display:block;font-size:14px;font-weight:600;color:#27272a;margin-bottom:6px}
.pw-wrap{position:relative}
.input{width:100%;height:42px;padding:0 13px;border:1px solid #d4d4d8;border-radius:8px;font-size:15px;color:#09090b;background:#fff;font-family:inherit}
.pw-wrap .input{padding-right:42px}
.input:focus{outline:none;border-color:#07c160;box-shadow:0 0 0 3px rgba(7,193,96,.12)}
.pw-eye{position:absolute;top:50%;right:7px;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:6px;background:transparent;color:#71717a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pw-eye:hover{background:#f4f4f5;color:#09090b}
.err{margin:0 0 14px;padding:10px 13px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:14px;line-height:1.5}
.info{margin:0 0 16px;padding:10px 13px;border-radius:8px;background:#f0fdf5;border:1px solid #bdebd0;color:#0b7a44;font-size:13px;line-height:1.55;display:flex;align-items:flex-start;gap:8px}
.row-link{margin-top:16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#71717a}
</style>
</head>
<body>
<div class="wrap">
  <div class="card-wrap">
    <div class="brand">
      <span class="mark"><i data-lucide="send" style="width:24px;height:24px"></i></span>
      <div class="brand-name">公众号发布台 · 创建账号</div>
      <div class="brand-sub">注册后进入 5 步配置向导，几分钟内完成接入</div>
    </div>

    <div class="card">
      <h1>注册</h1>
      {% if not allow_registration %}
      <div class="err">当前已暂停新用户注册，请联系管理员开通。</div>
      <div class="row-link"><a href="/login">← 返回登录</a></div>
      {% else %}
      <p class="desc">平台免费使用；注册后请先验证微信公众号配置。</p>

      {% if error %}
      <div class="err">{{ error }}</div>
      {% endif %}

      <div class="info">
        <i data-lucide="sparkles" style="width:17px;height:17px;flex:none;margin-top:2px"></i>
        <span>AI 自动配图目前由平台统一免费赠送，后续为覆盖算力成本可能单独收费。</span>
      </div>

      <form method="post" action="/register">
        <div class="field">
          <label class="lbl" for="reg-user">用户名</label>
          <input class="input" id="reg-user" type="text" name="username" value="{{ username_prefill }}" placeholder="3~64 位字母、数字、._-@" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="lbl" for="reg-name">公众号名称（可选）</label>
          <input class="input" id="reg-name" type="text" name="display_name" placeholder="例如：程序杂念（将自动带入配置第一项）">
        </div>
        <div class="field">
          <label class="lbl" for="reg-pw">密码（至少 6 位）</label>
          <div class="pw-wrap">
            <input class="input" id="reg-pw" type="password" name="password" placeholder="设置登录密码" autocomplete="new-password" required>
            <button type="button" class="pw-eye" data-target="reg-pw" aria-label="显示密码">
              <i data-lucide="eye" style="width:18px;height:18px"></i>
            </button>
          </div>
        </div>
        <div class="field" style="margin-bottom:18px">
          <label class="lbl" for="reg-pw2">确认密码</label>
          <div class="pw-wrap">
            <input class="input" id="reg-pw2" type="password" name="confirm_password" placeholder="再次输入密码" autocomplete="new-password" required>
            <button type="button" class="pw-eye" data-target="reg-pw2" aria-label="显示密码">
              <i data-lucide="eye" style="width:18px;height:18px"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn">注册并开始配置</button>
      </form>

      <div class="row-link">
        <span>已有账号？</span>
        <a href="/login">返回登录 →</a>
      </div>
      {% endif %}
    </div>
  </div>
</div>

<script>
if (window.lucide) lucide.createIcons();
document.querySelectorAll('.pw-eye').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var inp = document.getElementById(btn.dataset.target);
    if (!inp) return;
    var show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = '<i data-lucide="' + (show ? 'eye-off' : 'eye') + '" style="width:18px;height:18px"></i>';
    if (window.lucide) lucide.createIcons();
  });
});
</script>
</body>
</html>
